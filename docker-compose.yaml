services:
  wb:
    image: ghcr.io/hanpama/wb:main
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wb
    restart: unless-stopped
    # Shared memory for Chrome
    shm_size: 2gb
    # Security options for Chrome in container
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
