services:
  wb:
    image: ghcr.io/hanpama/wb:main
    container_name: wb
    environment:
      - WB_PORT=62066
      - WB_HEADLESS=true
    restart: unless-stopped
    # Shared memory for Chrome
    shm_size: 2gb
    # Security options for Chrome in container
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
