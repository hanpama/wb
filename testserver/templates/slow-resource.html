<!DOCTYPE html>
<html>
<head>
    <title>Slow Resource Test</title>
    <style>body { font-family: monospace; padding: 20px; }</style>
</head>
<body>
    <h1>Slow Resource Test</h1>
    <p>This page loads a slow resource (3 second delay).</p>
    <p>After clicking the link below, run 'wb show' immediately to see network status.</p>

    <img src="/delay?seconds=3" alt="Slow loading image" width="100" height="100">

    <p><a href="/">Back to Home</a></p>

    <script>
        // Also trigger some background requests
        fetch('/delay?seconds=2');
        fetch('/delay?seconds=1');
    </script>
</body>
</html>
